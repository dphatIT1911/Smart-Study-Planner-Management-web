version: '3.8'

services:
  app:
    build: .
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      # Render Database URL - inject via environment during deployment or local start
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - .env
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
