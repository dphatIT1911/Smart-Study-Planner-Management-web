services:
  # ---------------------------------------------
  # 1. BACKEND SERVICE (Docker FastAPI)
  # ---------------------------------------------
  - type: web
    name: smart-study-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    preDeployCommand: alembic upgrade head
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: PORT
        value: "8000"
      - key: BACKEND_CORS_ORIGINS
        value: "http://localhost:5173"
